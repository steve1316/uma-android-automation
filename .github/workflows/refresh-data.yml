name: Refresh game data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scrape and check, but do not open or merge a PR
        type: boolean
        default: false
      force:
        description: Scrape even if GameTora looks unchanged
        type: boolean
        default: false
  # A PR touching the scraper gets a full dry run, so a broken scraper is caught before it lands.
  pull_request:
    paths:
      - "scripts/data-scraper/**"
      - "update.py"
      - ".github/workflows/refresh-data.yml"

# One refresh at a time. A second run queues behind the first rather than racing it to master.
concurrency:
  group: refresh-data-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.plan.outputs.work }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/data-scraper/requirements.txt

      - run: pip install -r scripts/data-scraper/requirements.txt

      - name: Restore the last scraped GameTora ids
        uses: actions/cache/restore@v4
        with:
          path: scripts/data-scraper/.cache
          key: gametora-ids-${{ github.run_id }}
          restore-keys: gametora-ids-

      - id: plan
        run: python scripts/data-scraper/refresh.py plan

  refresh:
    needs: plan
    if: needs.plan.outputs.work == 'true' || inputs.force == true || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/data-scraper/requirements.txt

      - run: pip install -r scripts/data-scraper/requirements.txt pytest

      - name: Test the refresh helpers
        run: python -m pytest scripts/data-scraper -q

      - name: Scrape
        shell: bash
        run: python -u update.py --strict 2>&1 | tee scrape.log

      - name: Upload the scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: scrape.log
          if-no-files-found: ignore

      - name: Check the data
        run: python scripts/data-scraper/refresh.py check

      - name: Stamp the data version
        id: finalize
        shell: bash
        run: |
          if git diff --quiet -- src/data; then changed=false; else changed=true; fi
          python scripts/data-scraper/refresh.py finalize --data-changed "$changed"

      # The checkout keeps no token, so this is the only step that authenticates. master requires a PR, so the run opens one and merges it.
      - name: Open and merge the data PR
        if: steps.finalize.outputs.commit == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.finalize.outputs.subject }}
          LABEL: ${{ steps.finalize.outputs.label }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="data/${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add src/data scripts/data-scraper/included_cards.json src/pages/Skills/icons
          git commit -q -m "$SUBJECT"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          printf '## Description\n\n- This PR refreshes the game data from GameTora up to %s.\n' "$LABEL" > pr_body.md
          gh pr create --base master --head "$branch" --title "$SUBJECT" --body-file pr_body.md
          gh pr merge "$branch" --squash --subject "$SUBJECT" --body "" --delete-branch

      - name: Remember the scraped GameTora ids
        if: env.DRY_RUN != 'true'
        run: python scripts/data-scraper/refresh.py save-ids

      - name: Save the scraped GameTora ids
        if: env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: scripts/data-scraper/.cache
          key: gametora-ids-${{ github.run_id }}

      - name: Summary
        if: always()
        shell: bash
        env:
          COMMIT: ${{ steps.finalize.outputs.commit }}
          SUBJECT: ${{ steps.finalize.outputs.subject }}
        run: |
          {
            echo "### Game data refresh"
            echo "- Committed: ${COMMIT:-no}"
            echo "- Subject: ${SUBJECT:-none}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Changed files:"
            git status --short -- src/data scripts/data-scraper/included_cards.json | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
