plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
    alias(libs.plugins.ktlint)
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

ktlint {
    android = true
    ignoreFailures = true
    reporters {
        reporter "plain"
        reporter "checkstyle"
    }
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion libs.versions.app.buildToolsVersion.get()
    compileSdkVersion libs.versions.app.compileSdk.get() as Integer

    namespace 'com.steve1316.uma_android_automation'
    defaultConfig {
        applicationId 'com.steve1316.uma_android_automation'
        minSdkVersion libs.versions.app.minSdk.get() as Integer
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion libs.versions.app.targetSdk.get() as Integer
        versionCode libs.versions.app.versionCode.get() as Integer
        versionName libs.versions.app.versionName.get()

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""

        // Off by default so normal releases cannot be profiled. Set -PuaaProfileable=true to record a run with Perfetto.
        manifestPlaceholders.profileableByShell = (findProperty('uaaProfileable') ?: false).toBoolean().toString()
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            crunchPngs true  // Good for reducing APK size.
            // Usually no minification or resource shrinking.
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
            // Trim llama.rn CPU-feature variants we don't ship. The remaining variants (no-feature fallback,
            // v8, v8_2, v8_2_dotprod) still cover every arm64-v8a device that runs the rest of the app today;
            // i8mm and hexagon_opencl acceleration is dropped because the device population that benefits is
            // tiny relative to the ~16 MB compressed APK saving. If a future llama.rn version renames these
            // variants, these globs silently stop matching and the APK silently grows - re-check after every
            // llama.rn bump.
            excludes += [
                "**/librnllama_v8_2_i8mm.so",
                "**/librnllama_jni_v8_2_i8mm.so",
                "**/librnllama_v8_2_dotprod_i8mm.so",
                "**/librnllama_jni_v8_2_dotprod_i8mm.so",
                "**/librnllama_v8_2_dotprod_i8mm_hexagon_opencl.so",
                "**/librnllama_jni_v8_2_dotprod_i8mm_hexagon_opencl.so",
            ]
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    // Specify which architecture to make apks for, or set universalApk to true for an all-in-one apk with increased file size.
    splits {
        abi {
            enable true
            reset()
            //noinspection ChromeOsAbiSupport
            include("arm64-v8a", "x86_64")
            // armeabi-v7a dropped: llama.rn 0.12+ ships arm64-v8a only and 32-bit ARM Android phones are
            // effectively extinct (Google Play has required 64-bit since 2019).
            // x86_64 included so the Android emulator (running on x86_64 hosts) loads native llama.rn
            // binaries instead of running arm64-v8a through QEMU TCG translation. Must stay paired with
            // `reactNativeArchitectures=arm64-v8a,x86_64` in android/gradle.properties - that property
            // controls which ABIs RN actually compiles native modules for. Adding x86_64 here without
            // it produces an x86_64 split that's missing libexpo-modules-core.so and crashes on launch.
            universalApk false
        }
    }

    applicationVariants.configureEach { variant ->
        def releaseType = variant.buildType.name
        // Allow layout XMLs to get a reference to the application's version number.
        variant.resValue("string", "versionName", "v${variant.versionName}")

        // Auto-generate the file name.
        // To access the output file name, the apk variants must be explicitly cast to,
        // as in the previous groovy version (where they were implicitly cast).
        variant.outputs.configureEach { output ->
            def type = releaseType
            def versionName = variant.versionName
            def architecture = output.filters.first().identifier
            output.outputFileName = "v${versionName}-UmaAndroidAutomation-${architecture}-${type}.apk"
        }
    }

    androidResources {
        noCompress += ["bundle"]
    }

    testOptions {
        unitTests {
            // Allow unmocked Android framework methods to return default values.
            returnDefaultValues = true
        }
        unitTests.all {
            // Ensure JUnit 5 is used for Android unit test tasks.
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                showStandardStreams = true
                exceptionFormat = "full"
            }
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",")
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim()
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // Shared scoring math (Kotlin Multiplatform module: commonMain hosts the canonical formulas, jvm target consumed here).
    implementation(project(':scoring-shared'))

    // Automation Library
    implementation(libs.android.cv.automation.library)
    // implementation("com.github.steve1316:automation_library:TAG-SNAPSHOT") // Uncomment this for local testing and replace TAG with the snapshot versionName of the library.

    // Ktor for the embedded log streaming WebSocket server.
    implementation(libs.ktor.server.core)
    implementation(libs.ktor.server.cio)
    implementation(libs.ktor.server.websockets)

    // React Native
    implementation(libs.react.android)
    implementation(libs.hermes.android)

    // Lottie for the native splash screen
    implementation(libs.lottie)

    if (hermesEnabled.toBoolean()) {
        implementation(libs.hermes.android)
    } else {
        implementation jscFlavor
    }

    // Unit testing.
    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)
    // Real org.json implementation so unit tests can parse races.json / epithets.json without
    // the Android-stubbed JSONObject returning default values.
    testImplementation("org.json:json:20240303")

    // ONNX Runtime for YOLOv8 inference and on-device doc embedding for the documentation chatbot.
    implementation(libs.onnxruntime)

    // ojAlgo for the Smart Race Solver's MILP backend. Pure JVM, no native deps.
    implementation("org.ojalgo:ojalgo:55.1.1")

}

// //////////////////////////////////////////////////////////////////////////////////////////////////
// //////////////////////////////////////////////////////////////////////////////////////////////////
// Clean Hardening
// //////////////////////////////////////////////////////////////////////////////////////////////////
// //////////////////////////////////////////////////////////////////////////////////////////////////

// Delete `build/` and `.cxx/` before `externalNativeBuildClean<variant>` runs. Without this,
// gradlew clean invokes ninja clean against a stale `.cxx/` cache, which forces CMake to
// re-configure and trips a GLOB mismatch on missing RN codegen sources (RNLlamaSpec,
// RNCSlider, etc.). Removing `.cxx/` up front means there is nothing for ninja to clean.
tasks.register('cleanBuildArtifacts', Delete) {
    delete("${projectDir}/build")
    delete("${projectDir}/.cxx")
}

clean.dependsOn(cleanBuildArtifacts)

tasks.matching { it.name.startsWith('externalNativeBuildClean') }.configureEach {
    mustRunAfter('cleanBuildArtifacts')
}

